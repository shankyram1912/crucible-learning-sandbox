[project]
name = "lsb-cli"
version = "0.1.0"
description = "LSB Control Tower: lsb command line for the Learning Sandbox Self Service APIs"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "google-auth[requests]>=2.30",
]

[project.scripts]
lsb = "lsb_cli.main:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lsb_cli"]
