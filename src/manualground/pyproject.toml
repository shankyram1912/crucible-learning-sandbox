[project]
name = "manualground"
version = "0.1.0"
description = "NTU ManualGround: Layer 2 rate-paced bulk provisioner and cross-student isolation verifier"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "google-auth[requests]>=2.30",
]

[project.scripts]
mg = "manualground.cli.app:app"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manualground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: live cross-student isolation verification against a deployed GCP shard (requires MG_LIVE_E2E=1)",
]
